name: Sync World Cup scores

on:
  schedule:
    # Every 15 minutes — live scores & results during match windows
    - cron: '*/15 * * * *'
    # Every 3 hours — backfill any matches that finished without live tracking
    - cron: '0 */3 * * *'
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  sync-live:
    name: Live scores (every 15 min)
    runs-on: ubuntu-latest
    # Only run the 15-min job on the */15 trigger
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call auto-sync endpoint
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/sync?task=auto")
          cat /tmp/body.json
          echo ""
          if [ "$STATUS" -ge 400 ]; then
            echo "Sync failed with HTTP $STATUS"
            exit 1
          fi

  sync-fixtures:
    name: Backfill finished results (every 3 h)
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */3 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call fixtures-sync endpoint
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/sync?task=fixtures")
          cat /tmp/body.json
          echo ""
          if [ "$STATUS" -ge 400 ]; then
            echo "Fixtures sync failed with HTTP $STATUS"
            exit 1
          fi
